name: pnpm Install
description: Checkout the repository, setup Node.js and install dependencies using pnpm

inputs:
  install-args:
    description: 'Arguments to pass to pnpm install'
    required: false
    default: ''
  ref:
    description: 'Git ref to checkout'
    required: false
  fetch-depth:
    description: 'Number of commits to fetch. 0 indicates all history for all branches and tags.'
    required: false
  registry-url:
    description: 'Optional registry to set up for auth.'
    required: false
  token:
    description: 'GitHub Token (PAT) used in checkout'
    required: false

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ inputs.token || github.token }}

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: 'package.json'
        registry-url: ${{ inputs.registry-url }}

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: true

    - run: pnpm install ${{ inputs.install-args }}
      shell: bash
